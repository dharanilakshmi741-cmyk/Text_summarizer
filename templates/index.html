<!DOCTYPE html>
<html>

<head>
    <title>Text Summarizer & Classifier</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Text Summarizer & Classifier</h1>

    <form method="POST">

        <div class="input-area">

            <textarea
                name="text"
                placeholder="Enter your paragraph here..."
                required>{{ original_text }}</textarea>

            <button type="submit">
                Summarize
            </button>

        </div>

    </form>

    {% if summary %}

    <div class="result">

        <h2>Summarized Content</h2>

        <div class="content-box">
            {{ summary }}
        </div>

        <h2>Classification</h2>

        <div class="content-box">
            {{ category }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
